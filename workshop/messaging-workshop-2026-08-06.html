<style>
html, body { margin: 0; }
body { background: var(--bg-page); }

.wk-tab { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--fw-semibold); color: var(--text-secondary); background: transparent; border: 1px solid var(--border-default); border-radius: var(--radius-pill); padding: 6px 14px; cursor: pointer; line-height: 1; transition: background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard), border-color var(--dur-base) var(--ease-standard); }

/* ---------- mock shell ---------- */
.container { max-width: 1120px; margin-inline: auto; padding-inline: 40px; }
.band { padding-block: 84px; background: var(--bg-page); }

.intro { font-family: var(--font-sans); font-size: var(--text-lg); color: var(--text-secondary); line-height: var(--lh-relaxed); margin: 16px 0 0; max-width: 640px; }

.m-nav a.link { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--fw-medium); color: var(--text-secondary); text-decoration: none; }

/* hero */

.hero-inner { padding-block: 96px 92px; text-align: center; }

.hero-sub { font-family: var(--font-sans); font-size: var(--text-lg); color: var(--text-secondary); line-height: var(--lh-relaxed); margin: 20px auto 0; max-width: 600px; }

.statlbl { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--lh-relaxed); margin-top: 10px; }
.statsrc { font-family: var(--font-sans); font-size: 11px; color: var(--text-muted); margin-top: 8px; }
.step-num { font-family: var(--font-display); font-size: var(--text-sm); font-weight: var(--fw-semibold); color: var(--periwinkle-400); display: block; margin-bottom: 10px; letter-spacing: 0.06em; }
.phase-h { font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--periwinkle-400); margin: 34px 0 0; }

.status-tag { display: inline-block; font-family: var(--font-sans); font-size: 10px; font-weight: var(--fw-bold); letter-spacing: 0.08em; text-transform: uppercase; border-radius: var(--radius-pill); padding: 5px 10px; line-height: 1; margin-bottom: 14px; }

/* compare */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 40px; }
.compare .col { border-radius: var(--radius-2xl); padding: 28px; border: 1px solid var(--border-subtle); }

/* quote vignette */
.vignette { margin-top: 40px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-left: 3px solid var(--orange-500); border-radius: var(--radius-lg); padding: 28px 32px; }

/* cash panel */
.cash-panel { margin: 44px auto 0; max-width: 620px; text-align: left; background: rgba(255,255,255,0.04); border: 1px solid var(--border-default); border-radius: var(--radius-xl); padding: 22px 26px; backdrop-filter: blur(6px); }
.cash-panel .ph { font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--fw-bold); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted); margin: 0 0 14px; }
.cash-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--border-subtle); font-family: var(--font-sans); font-size: var(--text-sm); }

.cta-in { position: relative; }

.cta-h2 { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 44px; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink-900); margin: 16px auto 0; max-width: 680px; }
.cta-sub { font-family: var(--font-sans); font-size: var(--text-lg); color: var(--ink-900); line-height: var(--lh-relaxed); margin: 16px auto 0; opacity: 0.85; max-width: 540px; }

/* footer */

/* timeline */

.timeline .card { position: relative; }

/* scorecard */

table.sc th { font-size: var(--text-xs); font-weight: var(--fw-bold); letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); background: var(--surface-sunken); }
table.sc td.angle { color: var(--text-primary); font-weight: var(--fw-semibold); white-space: nowrap; }
table.sc input[type="number"] { width: 58px; background: var(--surface-sunken); color: var(--text-primary); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 6px 8px; font-family: var(--font-sans); font-size: var(--text-sm); }

.sc-note { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--lh-relaxed); }
.sc-decision { margin-top: 56px; background: var(--surface-card); border: 1px solid rgba(255,132,49,0.4); border-radius: var(--radius-2xl); padding: 30px; }
.sc-decision textarea { width: 100%; min-height: 70px; background: var(--surface-sunken); color: var(--text-primary); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 10px 12px; font-family: var(--font-sans); font-size: var(--text-sm); box-sizing: border-box; }

@media (max-width: 900px) {

  .h1 { font-size: 40px; }
  .m-nav .link { display: none; }
}
/* ---------- gamified butler variant ---------- */

function gmType(text, after) {
  const el = document.getElementById("gmText");
  const caret = document.getElementById("gmCaret");
  if (!el) return;
  clearTimeout(window._gmT);
  let done = false;
  const finish = () => { if (done) return; done = true; clearTimeout(window._gmT); el.textContent = text; if (caret) caret.style.display = "none"; if (after) after(); };
  window._gmFinishType = finish;
  if (REDUCED || window._gmSkip) { finish(); return; }
  el.textContent = "";
  let i = 0;
  const step = () => {
    if (done) return;
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { finish(); return; }
    const c = text[i - 1];
    let d = 14;
    if (c === " ") d = 24;
    else if (c === ",") d = 45;
    else if (c === "." || c === "?" || c === "!") d = 90;
    window._gmT = setTimeout(step, d);
  };
  window._gmT = setTimeout(step, 14);
  const card = el.closest(".chat-card");
  if (card) {
    card.style.cursor = "pointer";
    card.onclick = finish;
    card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); finish(); } };
  }
}

let gmMk = 0, gmHm = 0, gmWlSum = 0, gmWlDone = 0, gmT0 = null, gmDoneSet = new Set(), _introTimers = [];

function gmSettleCard(id) {
  const act = document.getElementById(id + "Act");
  const done = document.getElementById(id + "Done");
  const card = document.getElementById(id);
  if (card) card.classList.add("settled");
  if (REDUCED) {
    act.style.display = "none";
    done.classList.add("vis", "show");
    return;
  }
  act.classList.add("out");
  setTimeout(() => {
    act.style.display = "none";
    done.classList.add("vis");
    requestAnimationFrame(() => requestAnimationFrame(() => done.classList.add("show")));
  }, 120);
}

function gmApprove(id, group, extra) {
  const cardEl = document.getElementById(id);
  if (!cardEl || cardEl.dataset.done) return;
  cardEl.dataset.done = "1";
  gmSettleCard(id);
  if (group === "mk") {

    const c = document.getElementById("gmMkCount");
    if (c) c.innerHTML = gmMk >= 3 ? "<b>3 of 3.</b> All settled." : "<b>" + gmMk + " of 3</b> matters settled";
    if (gmMk >= 3) {
      const done = document.getElementById(id + "Done");
      if (done) done.classList.add("emph");
      const secs = gmT0 ? Math.round((performance.now() - gmT0) / 1000) : null;
      const timed = secs !== null && secs <= 120;
      const tail = " The day is yours; I shall keep the watch, and if anything moves that should not, you will hear from me before it compounds.";
      const noteText = timed
        ? "Queue cleared at 7:04. Three calls, " + secs + " seconds of your attention." + tail
        : "Queue cleared at 7:04. Three calls, all settled." + tail;
      const ctaSub = document.getElementById("gmCtaSub");
      if (ctaSub && timed) ctaSub.textContent = "You cleared three flags in " + secs + " seconds. Connect your accounts this afternoon; your first brief arrives at 7:00 tomorrow, with the night's work already done.";
      _introTimers.push(setTimeout(() => {
        const pay = document.getElementById("gmPayoff");
        if (pay) {
          pay.querySelector(".inner p").textContent = noteText;
          pay.classList.add("open");
          gmMark(2);
          pay.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });

      }, REDUCED ? 0 : 300));
    }
  }
  if (group === "hm") {
    gmHm++;
    const c = document.getElementById("gmHmCount");
    if (c) c.innerHTML = gmHm >= 3 ? "<b>3 of 3.</b> Every desk handled." : "<b>" + gmHm + " of 3</b> desks handled";
    if (gmHm >= 3) {
      const done = document.getElementById(id + "Done");
      if (done) done.classList.add("emph");
      const secs = gmT0 ? Math.round((performance.now() - gmT0) / 1000) : null;
      const timed = secs !== null && secs <= 120;
      const noteText = (timed
        ? "Three desks, three calls, " + secs + " seconds."
        : "Three desks, three calls, all settled.") +
        " That is the entire job: I read, I remember, I recommend; you decide. Everything below is how I keep earning it.";
      _introTimers.push(setTimeout(() => {
        const pay = document.getElementById("gmHmPayoff");
        if (pay) {
          pay.querySelector(".inner p").textContent = noteText;
          pay.classList.add("open");
          gmMark(2);
          pay.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
        }
      }, REDUCED ? 0 : 300));
    }
  }
  if (group === "wl") {
    gmWlDone++; gmWlSum += extra || 0;
    const row = document.getElementById(id + "Row");

/* shared scroll-reveal system + queue timer + stat count-ups (marketing page) */
function gmReveals() {
  requestAnimationFrame(() => {
    const els = document.querySelectorAll(".rv");
    if (REDUCED || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("rv-on")); }
    else {
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          const el = en.target;
          el.style.transitionDelay = (el.dataset.rvd || 0) + "ms";
          el.classList.add("rv-on");
          io.unobserve(el);
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -10% 0px" });
      els.forEach(e => io.observe(e));
    }
    const queue = document.getElementById("gmQueue");
    if (queue && "IntersectionObserver" in window) {
      const tio = new IntersectionObserver(entries => {
        if (entries.some(en => en.isIntersecting)) { if (!gmT0) gmT0 = performance.now(); tio.disconnect(); }
      }, { threshold: 0.35 });
      tio.observe(queue);
    } else if (queue) { gmT0 = performance.now(); }
    const band = document.getElementById("gmCf");
    const counts = document.querySelectorAll("[data-n]");
    const run = () => counts.forEach(el => {
      const target = parseFloat(el.dataset.n), suf = el.dataset.suf || "";
      if (REDUCED) { el.textContent = target + suf; return; }
      const start = performance.now();
      const tick = (now) => {
        const p = Math.min(1, (now - start) / 600), v = Math.round(target * (1 - Math.pow(1 - p, 3)));
        el.textContent = v + suf;
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    if (band && "IntersectionObserver" in window && !REDUCED) {
      const cio = new IntersectionObserver(entries => {
        if (entries.some(en => en.isIntersecting)) { run(); cio.disconnect(); }
      }, { threshold: 0.3 });
      cio.observe(band);
    } else if (band) { run(); }
  });
}

function gmAttachRail() {
  const bar = document.getElementById("gmBar");
  if (!bar) { window._gmRailTick = null; window.onscroll = null; return; }
  const steps = Array.from(document.querySelectorAll(".gm-step"));
  let ticking = false;
  const update = () => {
    ticking = false;
    const h = document.documentElement;
    const f = Math.min(1, h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight));
    const earned = steps.length ? gmDoneSet.size / steps.length : 0;
    bar.style.transform = "scaleX(" + Math.max(f, earned) + ")";
    steps.forEach((s, i) => s.classList.toggle("done", gmDoneSet.has(i) || f >= (i + 0.5) / steps.length));
  };
  window._gmRailTick = update;
  window.onscroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  update();
}

const RENDER_G = { home: renderHomeG, marketing: renderMarketingG, sales: renderSalesG, receivables: renderReceivablesG };

/* ---------- scorecard ---------- */

const ICPS = [
  { name: "CMO", who: "Shitanshu", brief: "You own pipeline and the board narrative. Judge the Home and Marketing pages: would you take the meeting?" },
  { name: "CSO", who: "Anand", brief: "You own the number. Judge the Home and Sales pages: does this beat what your CRM vendor pitched you?" },
  { name: "Receivables / Finance", who: "Dhiraj", brief: "You answer for the cash. Judge the Home and Receivables pages: is this credible to a CFO?" },
  { name: "Generalist", who: "Raghav", brief: "You run a bit of everything. Judge the Home page cold: do you understand what Alfred is in ten seconds?" },
  { name: "Founder", who: "role-play", brief: "You'd be the economic buyer. Judge Home + one module: is this a growth investment or another SaaS line item?" },
];

function renderScorecard() {
  const runOfShow =
    '<div class="card" style="margin-top:36px"><h3>How to run the hour (11:30 to 12:30)</h3>' +
    '<p class="sc-note" style="margin-top:10px">' +
    '1. <strong>5 min</strong>, setup: everyone opens this file, picks their ICP block below.<br/>' +
    '2. <strong>48 min</strong>, eight minutes per angle: switch the angle in the toolbar, each ICP silently reads their assigned pages, then fills their row and says one objection out loud. No debating mid-angle.<br/>' +
    '3. <strong>5 min</strong>, decision: tally the scores, fill the decision box, assign the Friday ship owner.<br/>' +
    'Scoring: <strong>Resonance</strong> = does this speak to my role (1 to 5). <strong>Clarity</strong> = do I get what Alfred is in ten seconds (1 to 5). <strong>CTA</strong> = tick if you would actually click it. Screenshot or print this tab at the end.</p></div>';

  const v = k => scState[k] !== undefined ? scState[k] : "";
  const blocks = ICPS.map((icp, bi) =>
    '<div class="sc-block"><h3>' + icp.name + ' <span style="color:var(--text-muted);font-weight:400">· ' + icp.who + '</span></h3>' +
    '<p class="role">' + icp.brief + '</p>' +
    '<table class="sc"><thead><tr><th>Angle</th><th>Resonance 1 to 5</th><th>Clarity 1 to 5</th><th>Would click CTA</th><th>One-line reaction</th></tr></thead><tbody>' +
    ANGLES.map((a, ai) => {
      const k = "i" + bi + "a" + ai;
      return '<tr><td class="angle">' + (ai + 1) + ' · ' + a.name + '</td>' +
      '<td><input type="number" min="1" max="5" data-k="' + k + 'res" value="' + v(k + "res") + '" /></td>' +
      '<td><input type="number" min="1" max="5" data-k="' + k + 'clar" value="' + v(k + "clar") + '" /></td>' +
      '<td><input type="checkbox" data-k="' + k + 'cta"' + (scState[k + "cta"] ? ' checked' : '') + ' /></td>' +
      '<td><input type="text" placeholder="…" data-k="' + k + 'note" value="' + String(v(k + "note")).replace(/"/g, '&quot;') + '" /></td></tr>';
    }).join('') +
    '</tbody></table></div>'
  ).join('');

  const decision =
    '<div class="sc-decision"><p class="eyebrow">Decision</p>' +
    '<h3 style="font-family:var(--font-display);font-size:24px;color:var(--text-primary);margin:12px 0 16px">Winner, changes, owner</h3>' +
    '<p class="sc-note">Winning angle (or hybrid), the changes it needs before shipping, who owns the Framer update, and the Friday publish checklist.</p>' +
    '<textarea data-k="decision" placeholder="Winning angle: …&#10;Changes before ship: …&#10;Owner: …&#10;Ship by: Friday">' + String(scState.decision || "") + '</textarea></div>';

  return '<div class="container sc-wrap">' +
    sectionHead('Workshop', 'Scorecard: five ICPs × six angles', 'Each person plays their ICP and scores every angle from that seat. High resonance with low clarity means the idea is right and the words are not.') +
    runOfShow + blocks + decision + '</div>';
}

/* =============================================================
   SHELL: tabs + render
   ============================================================= */

let curAngle = 0;
let curPage = "home";
const scState = {};
try { Object.assign(scState, JSON.parse(localStorage.getItem("wk-scores") || "{}")); } catch (err) {}
document.getElementById("stage").addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (k) {
    scState[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    try { localStorage.setItem("wk-scores", JSON.stringify(scState)); } catch (err) {}
  }
});

const RENDER = { home: renderHome, marketing: renderMarketing, sales: renderSales, receivables: renderReceivables };

function draw() {
  const stage = document.getElementById("stage");
  const a = ANGLES[curAngle];
  const gamified = a.gamified && curPage !== "scorecard";
  const external = a.external && curPage !== "scorecard";
  clearTimeout(window._gmT);
  _introTimers.forEach(clearTimeout); _introTimers = [];
  gmT0 = null; gmDoneSet = new Set();
  window._gmSkip = false; window._gmIntroDone = false; window._gmFinishType = null;
  if (curPage === "scorecard") {
    stage.innerHTML = renderScorecard();
    document.getElementById("thesis").innerHTML = "<strong>Scorecard.</strong> Fill during the workshop; screenshot or print when done.";
  } else if (external) {
    stage.innerHTML = '<iframe class="ext-frame" src="' + a.external + '" title="' + a.name + '"></iframe>';
    document.getElementById("thesis").innerHTML =
      "<strong>Angle " + (curAngle + 1) + " · " + a.name + ".</strong> " + a.thesis;
  } else if (gamified) {
    stage.innerHTML = RENDER_G[curPage]();
    document.getElementById("thesis").innerHTML =
      "<strong>Angle " + (curAngle + 1) + " · " + a.name + ".</strong> " + a.thesis;
  } else {
    stage.innerHTML = RENDER[curPage](a);
    document.getElementById("thesis").innerHTML =
      "<strong>Angle " + (curAngle + 1) + " · " + a.name + ".</strong> " + a.thesis;
  }
  document.body.classList.toggle("gm-on", !!gamified);
  drawTabs();
  window.scrollTo(0, 0);
  if (gamified) {
    if (curPage === "marketing") gmIntro();
    else gmType(GM_GREETINGS[curPage], () => { gmMark(0); gmShowChips(); });
    gmReveals();
    gmAttachRail();
  } else {
    window.onscroll = null;
    window._gmRailTick = null;
  }
}

function drawTabs() {
  const at = document.getElementById("angleTabs");
  at.querySelectorAll("button").forEach(b => b.remove());
  ANGLES.forEach((a, i) => {
    const b = document.createElement("button");
    b.className = "wk-tab" + (i === curAngle && curPage !== "scorecard" ? " on" : "");
    b.textContent = (i + 1) + " · " + a.name;
    b.onclick = () => { curAngle = i; if (curPage === "scorecard") curPage = "home"; draw(); };
    at.appendChild(b);
  });
  const pt = document.getElementById("pageTabs");
  pt.querySelectorAll("button").forEach(b => b.remove());
  PAGES.forEach(p => {
    const b = document.createElement("button");
    b.className = "wk-tab" + (p.id === curPage ? (p.id === "scorecard" ? " on-alt" : " on") : "");
    b.textContent = p.label;
    b.onclick = () => { curPage = p.id; draw(); };
    pt.appendChild(b);
  });
}

/* deep links: #a2-sales opens angle 2, sales page; #scorecard opens the scorecard */
function applyHash() {
  const h = location.hash.replace("#", "");
  if (!h) return;
  if (h === "scorecard") { curPage = "scorecard"; return; }
  const m = h.match(/^a([1-7])(?:-(home|marketing|sales|receivables))?$/);
  if (m) { curAngle = +m[1] - 1; curPage = m[2] || "home"; }
}
window.addEventListener("hashchange", () => { applyHash(); draw(); });
applyHash();

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key >= "1" && e.key <= "9" && +e.key <= ANGLES.length) { curAngle = +e.key - 1; if (curPage === "scorecard") curPage = "home"; draw(); }
  const map = { h: "home", m: "marketing", s: "sales", r: "receivables", c: "scorecard" };
  if (map[e.key]) { curPage = map[e.key]; draw(); }
});

draw();
</script>
