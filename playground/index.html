<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alfred AI — Component playground</title>
<link rel="icon" href="../assets/logos/alfred-favicon-black.svg" />
<link rel="stylesheet" href="../styles.css" />
<!-- React is committed under ../vendor/ (shared with the four UI kits), not
     loaded from a CDN. This page is
     published to GitHub Pages, so it cannot point at node_modules the way
     tests/harness.html does, and an SRI hash only proves the CDN served the
     right bytes — it does not help when the CDN is down. 142KB of production
     React, byte-identical to the installed 18.3.1 (verify-playground checks
     that), buys a docs page with no third-party runtime dependency at all.
     No Babel: the playground is authored in plain React.createElement, so
     there is nothing to compile at runtime. -->
<script src="../vendor/react-18.3.1.production.min.js"></script>
<script src="../vendor/react-dom-18.3.1.production.min.js"></script>
<script src="../_ds_bundle.js"></script>
<link rel="stylesheet" href="playground.css" />
</head>
<body>
<div id="root"></div>
<noscript>
  <p style="font-family: var(--font-sans); padding: 40px;">
    The playground renders live components, so it needs JavaScript. The static
    specimen cards in <a href="../index.html">the gallery</a> do not.
  </p>
</noscript>
<script src="playground.js"></script>
</body>
</html>
